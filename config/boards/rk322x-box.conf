# ================================================================
# RK3229 TV Box Configuration with SSV6158 WiFi Support
# ================================================================

# Basic board identification
BOARD_NAME="RK3229 TV Box (SSV6158)"
BOARDFAMILY="rk322x"
BOOTCONFIG="rk322x-box_defconfig"

# Bootloader configuration
BOOTSOURCE='https://github.com/u-boot/u-boot.git'
BOOTBRANCH='branch:v2024.01'
BOOTSCRIPT="boot-rockchip:boot-rockchip.cmd"
BOOTENV_FILE='rockchip.txt'
BOOTPATCHDIR="u-boot-rockchip"
UBOOT_TARGET_MAP=";;idbloader.bin uboot.img trust.bin"

# Kernel configuration
KERNEL_TARGET="current,legacy,vendor,media"
KERNELSOURCE='https://github.com/armbian/linux-rockchip'
KERNELBRANCH="branch:linux-6.1.y"  # Default branch

# Special kernel settings
if [[ $BRANCH == "media" ]]; then
    KERNELSOURCE='https://github.com/rockchip-linux/kernel'
    KERNELBRANCH="branch:develop-5.10"
    KERNEL_USE_GCC='> 7.5'
fi

if [[ $BRANCH == "vendor" ]]; then
    KERNELSOURCE='https://github.com/rockchip-linux/kernel'
    KERNELBRANCH="branch:linux-5.10-gen-rkr4"
    KERNEL_USE_GCC='> 7.5'
fi

# Device Tree Overrides (adjust for your specific device)
MAINLINE_FDTFILE="rk322x-box-trn9.dtb"  # Tanix TX9s
#MAINLINE_FDTFILE="rk322x-box-x7-5.1.dtb"  # Beelink X7
#MAINLINE_FDTFILE="rk322x-box.dtb"  # Generic

# Hardware-specific configuration
CPUMIN="408000"
CPUMAX="1392000"
GOVERNOR="ondemand"
HAS_VIDEO_OUTPUT="no"

# WiFi and Bluetooth configuration
WIREGUARD="no"
WLAN_VENDOR="ssv"
MODESWITCH="no"

# Storage configuration
BOOTFS_TYPE="fat"
SRC_EXTLINUX="yes"
INITRD_ARCH="arm"

# Image configuration
IMAGE_PARTITION_TABLE="gpt"
BOOTSIZE="256"
ROOTFSTYPE="ext4"

# Hardware acceleration
ENABLE_ROCKCHIP_MPP="yes"
ENABLE_MALI="no"  # RK3229 doesn't have 3D GPU acceleration

# ================================================================
# SSV6158 WiFi Specific Configuration
# ================================================================

# Add custom firmware package
IMAGE_PACKAGES="$IMAGE_PACKAGES firmware-ssv6051"

# Kernel configuration for SSV6158
function post_config_kernel() {
    # Current and edge kernels
    if [[ $BRANCH == "current" || $BRANCH == "edge" ]]; then
        kernel_config_set_m CONFIG_WLAN_VENDOR_SSV y
        kernel_config_set_m CONFIG_SSV6051 m
        kernel_config_set_m CONFIG_SSV6XXX_DEBUGFS y
        
        # Disable conflicting drivers
        kernel_config_set_m CONFIG_RTL8XXXU n
        kernel_config_set_m CONFIG_RTL8192CU n
    fi

    # Legacy kernel (4.4.x)
    if [[ $BRANCH == "legacy" ]]; then
        kernel_config_set_m CONFIG_WLAN_VENDOR_SSV y
        kernel_config_set_m CONFIG_SSV6051 m
    fi

    # Vendor kernels
    if [[ $BRANCH == "vendor" || $BRANCH == "media" ]]; then
        # Vendor kernels usually have SSV driver built-in
        kernel_config_set_m CONFIG_WLAN_VENDOR_SSV y
        kernel_config_set_m CONFIG_SSV6051 y
    fi
}

# Post-build actions
function post_family_config() {
    # Enable additional WiFi features
    export EXTRAWIFI="yes"
    export WIREGUARD="no"
    
    # Add init script for SSV6051
    cp ${SRC}/packages/extras/ssv6051-init/ssv6051-init.service ${SDCARD}/etc/systemd/system/
    chroot_sdcard systemctl enable ssv6051-init.service
}

# ================================================================
# Hardware Acceleration Configuration
# ================================================================
if [[ $BRANCH == "media" || $BRANCH == "vendor" ]]; then
    # Enable full media acceleration for vendor kernels
    function family_tweaks_bsp() {
        install -m 755 $SRC/packages/bsp/rk322x/ffmpeg_drm $SDCARD/usr/bin/
        install -m 755 $SRC/packages/bsp/rk322x/mpv_drm $SDCARD/usr/bin/
        
        echo "export LIBVA_DRIVER_NAME=rkmpp" >> $SDCARD/etc/environment
        echo "export LIBVA_DRIVERS_PATH=/usr/lib/arm-linux-gnueabihf/dri" >> $SDCARD/etc/environment
    }
fi

# ================================================================
# Device-Specific Tweaks
# ================================================================
function family_tweaks() {
    # Fix HDMI audio
    mkdir -p $SDCARD/etc/alsa/conf.d
    echo "options snd-hda-intel model=generic" > $SDCARD/etc/modprobe.d/alsa-base.conf
    
    # Improve power management
    echo "vm.dirty_writeback_centisecs=2000" >> $SDCARD/etc/sysctl.conf
    echo "vm.dirty_expire_centisecs=5000" >> $SDCARD/etc/sysctl.conf
    
    # Enable IR support (if needed)
    # echo "blacklist rk805_ir" >> $SDCARD/etc/modprobe.d/blacklist.conf
    # echo "install ir_rc5 /bin/true" >> $SDCARD/etc/modprobe.d/blacklist.conf
}

# ================================================================
# Build Optimization
# ================================================================
if [[ $BUILD_ALL == "yes" || $KERNEL_ONLY != "yes" ]]; then
    # Reduce build time by skipping unnecessary packages
    PACKAGE_LIST_EXCLUDE+=" f2fs-tools gdisk"
    SKIP_BOOTSPLASH="yes"
fi
