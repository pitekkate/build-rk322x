name: Manual Build - Armbian hk1mini

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        type: choice
        description: 'Pilih versi kernel yang akan dibangun'
        options:
          - current
          - legacy
        default: current

jobs:
  build:
    name: Build Image Armbian
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode repo
        uses: actions/checkout@v4

      - name: Setup Dependencies
        run: |
          sudo apt update
          sudo apt install -y git build-essential libncurses5-dev flex bison libssl-dev ccache libelf-dev

      - name: Clone Armbian Build Framework
        run: |
          git clone https://github.com/armbian/build 
          cd build

      - name: Configure non-interactive build
        run: |
          cd build
          # Salin config contoh sebagai dasar
          cp userpatches/config-example.conf userpatches/myconfig.conf

          # Ubah config untuk disable interaktif dan set opsi build
          echo "BOARD=hk1mini" >> userpatches/myconfig.conf
          echo "RELEASE=noble" >> userpatches/myconfig.conf
          echo "BUILD_MINIMAL=no" >> userpatches/myconfig.conf
          echo "BUILD_DESKTOP=no" >> userpatches/myconfig.conf
          echo "KERNELBRANCH=${{ inputs.kernel_branch }}" >> userpatches/myconfig.conf

      - name: Jalankan Proses Build
        run: |
          cd build
          ./compile.sh BOARD=hk1mini RELEASE=noble BUILD_MINIMAL=no BUILD_DESKTOP=no

      - name: Cek hasil build
        run: |
          ls -la output/images/

      - name: Upload ke GitHub Release
        if: success()
        uses: ncipollo/release-action@v1
        with:
          artifacts: "output/images/*.img.xz"
          token: ${{ secrets.GITHUB_TOKEN }}
