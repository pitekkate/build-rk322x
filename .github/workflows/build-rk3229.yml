name: Build Armbian RK3229 with SSV6158 Support

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'OS Release (jammy, bookworm, etc)'
        required: true
        default: 'jammy'
      kernel:
        description: 'Kernel Branch (current, legacy)'
        required: true
        default: 'current'
  schedule:
    - cron: '0 0 * * *'  # Daily build at midnight UTC

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: docker.io/armbian/build:latest
      options: --privileged -v /proc:/proc -v /sys:/sys

    steps:
    - name: Checkout Custom Branch
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}
        ref: ssv6158  # NAMA BRANCH KUSTOM
        submodules: recursive
        path: build

    - name: Setup Build Environment
      run: |
        apt-get update -qq
        apt-get install -y -qq \
          bc bison flex libssl-dev \
          libncurses-dev device-tree-compiler \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
          wget ca-certificates

    - name: Verify Branch
      run: |
        cd build
        echo "Building from branch:"
        git branch --show-current
        echo "Last commit:"
        git log -1 --oneline

    - name: Prepare Configuration
      run: |
        cd build
        # Gunakan konfigurasi default untuk rk322x-box
        echo "BOARD=rk322x-box" >> $GITHUB_ENV
        echo "BRANCH=${{ inputs.kernel || 'current' }}" >> $GITHUB_ENV
        echo "RELEASE=${{ inputs.release || 'jammy' }}" >> $GITHUB_ENV
        
        # Aktifkan konfigurasi khusus SSV6158
        if [ -f config/boards/rk322x-box-ssv6158.conf ]; then
          cp config/boards/rk322x-box-ssv6158.conf config/boards/rk322x-box.conf
        fi
        
        # Pastikan package SSV6158 termasuk
        if ! grep -q "firmware-ssv6051" config/cli/common/main/packages; then
          echo "firmware-ssv6051" >> config/cli/common/main/packages
        fi

    - name: Build Image
      run: |
        cd build
        ./compile.sh \
          BOARD=${{ env.BOARD }} \
          BRANCH=${{ env.BRANCH }} \
          RELEASE=${{ env.RELEASE }} \
          BUILD_MINIMAL=no \
          BUILD_DESKTOP=no \
          KERNEL_ONLY=no \
          KERNEL_CONFIGURE=yes \
          EXTRAWIFI=yes \
          BSPFREEZE=yes \
          CLEAN_LEVEL="make,debs" \
          LOG_SUBPATH="github-actions"

    - name: Archive Image
      uses: actions/upload-artifact@v4
      with:
        name: armbian-${{ env.BOARD }}-${{ env.BRANCH }}-${{ env.RELEASE }}
        path: build/output/images/*.img
        retention-days: 7

    - name: Archive Packages
      uses: actions/upload-artifact@v4
      with:
        name: debs-${{ env.BOARD }}-${{ env.BRANCH }}
        path: build/output/debs/*.deb
        retention-days: 3

    - name: Save Build Logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build/output/logs
          build/output/debug
        retention-days: 2
