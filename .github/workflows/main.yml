name: Manual Build Armbian RK3229 + SSV6158

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'OS Release'
        required: true
        default: 'jammy'
        type: choice
        options:
          - jammy
          - bookworm
          - bullseye
      kernel:
        description: 'Kernel Branch'
        required: true
        default: 'current'
        type: choice
        options:
          - current
          - edge
          - legacy
          - vendor
          - media

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: armbian/build:latest
      options: --privileged -v /proc:/proc -v /sys:/sys

    steps:
    - name: Checkout Branch ssv6158
      uses: actions/checkout@v4
      with:
        ref: ssv6158
        submodules: recursive
        path: build

    - name: Configure Build Parameters
      run: |
        cd build
        echo "BOARD=rk322x-box" >> $GITHUB_ENV
        echo "BRANCH=${{ github.event.inputs.kernel || 'current' }}" >> $GITHUB_ENV
        echo "RELEASE=${{ github.event.inputs.release || 'jammy' }}" >> $GITHUB_ENV
        echo "CLEAN=make,debs" >> $GITHUB_ENV

        # Special flags for kernels
        if [[ "${{ github.event.inputs.kernel }}" == "vendor" ]]; then
          echo "KERNEL_CONFIGURE=no" >> $GITHUB_ENV
        else
          echo "KERNEL_CONFIGURE=yes" >> $GITHUB_ENV
        fi

    - name: Build Image
      run: |
        cd build
        ./compile.sh \
          BOARD=${{ env.BOARD }} \
          BRANCH=${{ env.BRANCH }} \
          RELEASE=${{ env.RELEASE }} \
          BUILD_MINIMAL=no \
          BUILD_DESKTOP=no \
          KERNEL_ONLY=no \
          KERNEL_CONFIGURE=${{ env.KERNEL_CONFIGURE }} \
          CLEAN_LEVEL="${{ env.CLEAN }}"

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: armbian-${{ env.BOARD }}-${{ env.BRANCH }}-${{ env.RELEASE }}
        path: build/output/images/*.img
        retention-days: 7
