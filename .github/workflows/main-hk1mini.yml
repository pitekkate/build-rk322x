name: Manual Build - Armbian hk1mini

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        type: choice
        description: 'Pilih versi kernel'
        options:
          - current
          - legacy
        default: current
      os_release:
        type: choice
        description: 'Pilih rilis Ubuntu/Debian'
        options:
          - jammy
          - noble
          - focal
          - bookworm
        default: noble
      build_desktop:
        type: choice
        description: 'Aktifkan build Desktop Environment?'
        options:
          - yes
          - no
        default: no

jobs:
  build:
    name: Build Image Armbian
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode repo
        uses: actions/checkout@v4
        with:
          repository: pitekkate/build-rk322x
          ref: hk1mini

      - name: Buat direktori config jika belum ada
        run: |
          mkdir -p config/targets

      - name: Cek apakah hk1mini.conf ada
        id: check_conf
        run: |
          if [ -f config/targets/hk1mini.conf ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Buat hk1mini.conf secara otomatis jika tidak ada
        if: steps.check_conf.outputs.exists == 'false'
        run: |
          cat > config/targets/hk1mini.conf <<EOL
BOARD=hk1mini
RELEASE=${{ inputs.os_release }}
BUILD_MINIMAL=no
BUILD_DESKTOP=no
CUSTOMIZE_IMAGE=yes
IMAGE_SIZE=1GB
EOL

      - name: Set OS Release di config/targets/hk1mini.conf
        run: |
          if grep -q "^RELEASE=" config/targets/hk1mini.conf; then
            sed -i "s/^RELEASE=.*/RELEASE=${{ inputs.os_release }}/" config/targets/hk1mini.conf
          else
            echo "RELEASE=${{ inputs.os_release }}" >> config/targets/hk1mini.conf
          fi

      - name: Set BUILD_DESKTOP based on input
        if: ${{ inputs.build_desktop == 'yes' }}
        run: |
          if grep -q "^BUILD_DESKTOP=" config/targets/hk1mini.conf; then
            sed -i "s/^BUILD_DESKTOP=no/BUILD_DESKTOP=yes/" config/targets/hk1mini.conf
          else
            echo "BUILD_DESKTOP=yes" >> config/targets/hk1mini.conf
          fi

      - name: Setup Environment untuk Build Armbian
        uses: armbian/build@main
        with:
          armbian_token: "${{ secrets.GITHUB_TOKEN }}"
          armbian_target: image
          armbian_board: hk1mini
          armbian_kernel_branch: ${{ inputs.kernel_branch }}
          armbian_release: ${{ inputs.os_release }}
          armbian_branch: master

      - name: Cek hasil build
        run: |
          ls -la output/images/

      - name: Upload ke GitHub Release
        if: success()
        uses: ncipollo/release-action@v1
        with:
          artifacts: "output/images/*.img.xz"
          token: ${{ secrets.GITHUB_TOKEN }}
